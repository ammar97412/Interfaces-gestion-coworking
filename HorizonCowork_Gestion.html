  <h2>Article 1 — Objet</h2><p>Mise à disposition de la <b>${esc(e.nom)}</b> (capacité ${e.cap} personnes${e.equip?', équipée : '+esc(e.equip):''}) pour : <b>${esc(r.objet||'réunion')}</b>, ${r.participants?r.participants+' participants':''}.</p><h2>Article 2 — Date et horaires</h2><p>Le <b>${fmtDL(r.date)}</b> de <b>${r.debut}</b> à <b>${r.fin}</b>, soit ${h} heure${h>1?'s':''}. Tout dépassement est facturé par heure entamée au tarif en vigueur.</p><h2>Article 3 — Prix</h2><p>Montant de la prestation : <b>${fmt(r.montant)} TTC</b>${r.acompte?`, dont un acompte de <b>${fmt(r.acompte)}</b> (${s.acompteSalle} %) exigible à la réservation, le solde étant réglé au plus tard le jour de la prestation`:''}. En cas d'annulation moins de 48 heures avant, l'acompte reste acquis au prestataire.</p><h2>Article 4 — Obligations</h2><p>Le bénéficiaire s'engage à utiliser la salle conformément à sa destination, à respecter les autres occupants de l'espace, à restituer les lieux et le matériel en l'état, et répond de toute dégradation. Le prestataire assure la disponibilité de la salle, de la connexion internet, du matériel de projection et du café/thé.</p><div class="sig"><div>Le bénéficiaire<br><i>« Lu et approuvé »</i><span></span></div><div>Pour ${esc(s.raison)}<span></span></div></div>`}
 else if(type==='presence'){const m=M(id);titre='Attestation';const a=S.abonnements.filter(x=>x.membreId===id).sort((x,y)=>y.debut.localeCompare(x.debut))[0];
  body=App.docHead('ATTESTATION D\'OCCUPATION',App.nextNum('Ctr'),'Alger, le '+fmtD(today()))+`<p>Nous soussignés, <b>${esc(s.raison)}</b> (RC ${esc(s.rc)}, NIF ${esc(s.nif)}), exploitant l'espace de coworking <b>${esc(s.nom)}</b> sis ${esc(s.adresse)}, attestons que :</p><div class="box"><b>${esc(mName(m.id))}</b>${m.adresse?'<br>'+esc(m.adresse):''}${m.nif?'<br>NIF '+esc(m.nif):''}</div><p>occupe régulièrement nos locaux en qualité de membre${a?` dans le cadre de la formule « ${esc(T(a.tarifId)?.label)} »${a.espaceId?' (espace '+esc(E(a.espaceId)?.code)+')':''}, du ${fmtD(a.debut)} au ${fmtD(a.fin)}`:''}, et y exerce son activité professionnelle.</p><p>La présente attestation est délivrée pour servir et valoir ce que de droit.</p><div class="sig"><div></div><div>Pour ${esc(s.raison)}<br>${esc(s.gerant)}, gérant<span></span></div></div>`;save()}
 else if(type==='releve'){const m=M(id);titre='Relevé de compte';const facs=S.factures.filter(f=>f.membreId===id&&!['brouillon','annulée'].includes(f.statut)).sort((a,b)=>a.date.localeCompare(b.date));const pays=S.paiements.filter(p=>p.membreId===id);const lines=[...facs.map(f=>({d:f.date,l:'Facture '+f.numero+' — '+f.objet,deb:f.totaux.net,cre:0})),...pays.map(p=>({d:p.date,l:'Règlement '+p.numero+' ('+p.mode+')',deb:0,cre:p.montant}))].sort((a,b)=>a.d.localeCompare(b.d));let solde=0;
  body=App.docHead('RELEVÉ DE COMPTE CLIENT','','Arrêté au '+fmtD(today()))+App.clientBox(id)+`<table><tr><th>Date</th><th>Libellé</th><th class="r">Débit</th><th class="r">Crédit</th><th class="r">Solde</th></tr>${lines.map(x=>{solde+=x.deb-x.cre;return`<tr><td>${fmtD(x.d)}</td><td>${esc(x.l)}</td><td class="r">${x.deb?fmt(x.deb):''}</td><td class="r">${x.cre?fmt(x.cre):''}</td><td class="r">${fmt(solde)}</td></tr>`}).join('')}</table><p><b>Solde ${solde>0?'dû par le client':'en faveur du client'} : ${fmt(Math.abs(solde))}</b></p>`}
 else if(type==='fiche'){const m=M(id);titre='Fiche client';body=App.docHead('FICHE CLIENT','','Éditée le '+fmtD(today()))+App.clientBox(id)+`<table><tr><th>Champ</th><th>Valeur</th></tr>${[['Type',m.type==='societe'?'Société':'Particulier'],['Statut',m.statut],['Client depuis',fmtD(m.dateCreation)],['Source',m.source],['Activité',m.activite],['Gérant',m.gerant],['Pièces fournies',(m.pieces||[]).join(', ')||'aucune'],['Notes',m.notes]].map(x=>`<tr><td>${x[0]}</td><td>${esc(x[1]||'—')}</td></tr>`).join('')}</table><h2>Abonnements</h2><table><tr><th>Formule</th><th>Espace</th><th>Début</th><th>Fin</th><th>Statut</th></tr>${S.abonnements.filter(a=>a.membreId===id).map(a=>`<tr><td>${esc(T(a.tarifId)?.label)}</td><td>${a.espaceId?esc(E(a.espaceId)?.code):'—'}</td><td>${fmtD(a.debut)}</td><td>${fmtD(a.fin)}</td><td>${App.abStatut(a)}</td></tr>`).join('')||'<tr><td colspan="5">—</td></tr>'}</table>`}
 else if(type==='vierge'){titre='Formulaire d\'ouverture de compte';body=App.docHead('FORMULAIRE D\'OUVERTURE DE COMPTE','','Date : ____ / ____ / ________')+`<h2>Identité</h2><table>${['Nom et prénom','Raison sociale (si société)','Forme juridique','N° RC','NIF','AI / NIS','Adresse','Téléphone / WhatsApp','Email','Activité','Gérant / représentant'].map(x=>`<tr><td style="width:35%">${x}</td><td></td></tr>`).join('')}</table><h2>Formule choisie</h2><table>${S.tarifs.filter(t=>['mois','trimestre','semaine'].includes(t.unite)).map(t=>`<tr><td>☐ ${esc(t.label)}</td><td class="r">${fmt0(t.prix)} DA / ${t.unite}</td></tr>`).join('')}</table><h2>Pièces fournies</h2><p>${PIECES.map(p=>'☐ '+p).join(' &nbsp; ')}</p><p>Je déclare avoir pris connaissance du règlement intérieur et des conditions générales de ${esc(s.nom)}.</p><div class="sig"><div>Signature du client<span></span></div><div>Réservé à l'accueil<span></span></div></div>`}
 return{titre,html:`<div class="doc">${body}${App.docFoot()}</div>`}};
App.printDoc=(type,id)=>{const d=App.buildDoc(type,id);if(!d)return toast('Document introuvable',true);document.getElementById('printArea').innerHTML=d.html;
 modal(d.titre,`<div class="doc-view">${d.html}</div>`,{size:'xl',foot:`<span class="hint" style="flex:1">Imprimer → choisissez « Enregistrer en PDF » dans la boîte d'impression pour obtenir un fichier PDF.</span><button class="btn" onclick="closeModal()">Fermer</button><button class="btn" onclick="App.openDoc()">Ouvrir dans un onglet</button><button class="btn p" onclick="window.print()">Imprimer / PDF</button>`});
 log('Document '+d.titre+' généré')};
App.openDoc=()=>{const css=document.querySelector('style').textContent;const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>Document</title><style>${css}#printArea{display:block}</style></head><body><div id="printArea">${document.getElementById('printArea').innerHTML}</div><script>setTimeout(()=>window.print(),400)<\/script></body></html>`;
 try{const w=window.open('','_blank');if(!w)throw 0;w.document.write(html);w.document.close()}catch(e){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='document.html';a.click()}catch(e2){toast('Ouverture bloquée par le navigateur : utilisez Imprimer / PDF',true)}}};
App.page_documents=()=>{const opts=membreOpts();return`<div class="grid g2"><div class="card"><h3>Documents client</h3><form id="fDoc" class="f" onsubmit="return false">${fld('Client',`<select name="membreId">${sel(opts,App._arg||'')}</select>`)}${fld('Document',`<select name="type">${sel([{v:'domiciliation',l:'Attestation de domiciliation (pour le CNRC / impôts)'},{v:'contrat',l:'Contrat d\'abonnement coworking (dernier abonnement)'},{v:'presence',l:'Attestation d\'occupation / de présence'},{v:'releve',l:'Relevé de compte client'},{v:'fiche',l:'Fiche client récapitulative'}],'domiciliation')}</select>`)}<div class="btns"><button class="btn p" onclick="App.genDoc()">Générer & aperçu</button></div></form><div class="hint" style="margin-top:12px">Le contrat utilise l'abonnement le plus récent du client. Les attestations sont numérotées automatiquement (série ${esc(S.settings.pCtr)}).</div></div>
 <div class="card"><h3>Formulaires vierges & modèles</h3><div class="btns"><button class="btn" onclick="App.printDoc('vierge')">Formulaire d'ouverture de compte (papier)</button></div><h3 style="margin-top:18px">Historique des attestations émises</h3>${S.docs.length?`<table><tr><th>N°</th><th>Date</th><th>Type</th><th>Client</th></tr>${S.docs.slice().reverse().slice(0,30).map(x=>`<tr><td>${x.numero}</td><td>${fmtD(x.date)}</td><td>${x.type}</td><td>${esc(mName(x.membreId))}</td></tr>`).join('')}</table>`:'<div class="empty">Aucune attestation émise.</div>'}</div></div>`};
App.genDoc=()=>{const o=getForm('fDoc');if(!o.membreId)return toast('Choisissez un client',true);if(o.type==='contrat'){const a=S.abonnements.filter(x=>x.membreId===o.membreId).sort((x,y)=>y.debut.localeCompare(x.debut))[0];if(!a)return toast('Ce client n\'a pas d\'abonnement',true);return App.printDoc('contrat',a.id)}App.printDoc(o.type,o.membreId)};

/* ===================== RAPPORTS ===================== */
App.page_rapports=()=>{const months=[];const d=new Date();for(let i=11;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);months.push(iso(x).slice(0,7))}
 const enc=months.map(k=>S.paiements.filter(p=>monthKey(p.date)===k).reduce((s,p)=>s+p.montant,0));const fac=months.map(k=>S.factures.filter(f=>monthKey(f.date)===k&&!['brouillon','annulée'].includes(f.statut)).reduce((s,f)=>s+f.totaux.htn,0));const mx=Math.max(1,...enc,...fac);
 const cat={};S.factures.filter(f=>!['brouillon','annulée'].includes(f.statut)&&monthKey(f.date)>=months[0]).forEach(f=>f.lignes.forEach(l=>{const t=S.tarifs.find(x=>l.desc.startsWith(x.label));const c=t?t.cat:'autre';cat[c]=(cat[c]||0)+l.qte*l.pu}));const catTot=Object.values(cat).reduce((s,v)=>s+v,0)||1;
 const top=S.membres.map(m=>({m,v:S.paiements.filter(p=>p.membreId===m.id).reduce((s,p)=>s+p.montant,0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,8);
 const imp=S.factures.filter(f=>['émise','partielle'].includes(f.statut)).sort((a,b)=>a.echeance.localeCompare(b.echeance));const oc=App.occupation();
 const bars=(vals,color)=>`<div class="bars">${vals.map((v,i)=>`<div style="height:${v/mx*100}%;background:${color}" title="${fmt(v)}"><em>${v?fmt0(v/1000)+'k':''}</em><span>${monthLabel(months[i])}</span></div>`).join('')}</div>`;
 return`<div class="grid g2" style="margin-bottom:16px"><div class="card"><h3>Encaissements — 12 derniers mois</h3>${bars(enc,'var(--navy)')}<div style="height:20px"></div><div class="mini">Total : <b>${fmt(enc.reduce((a,b)=>a+b,0))}</b> · Moyenne mensuelle : ${fmt(enc.reduce((a,b)=>a+b,0)/12)}</div></div>
 <div class="card"><h3>Chiffre d'affaires facturé HT — 12 derniers mois</h3>${bars(fac,'var(--gold)')}<div style="height:20px"></div><div class="mini">Total HT : <b>${fmt(fac.reduce((a,b)=>a+b,0))}</b> · TVA collectée : ${fmt(S.factures.filter(f=>!['brouillon','annulée'].includes(f.statut)&&monthKey(f.date)>=months[0]).reduce((s,f)=>s+f.totaux.tva,0))}</div></div></div>
 <div class="grid g3" style="margin-bottom:16px"><div class="card"><h3>Répartition du CA par activité (HT)</h3>${Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(x=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(x[0])}</span><b>${fmt0(x[1])} DA · ${Math.round(x[1]/catTot*100)} %</b></div><div style="height:6px;background:#EEF0F4;border-radius:3px"><div style="height:6px;width:${x[1]/catTot*100}%;background:var(--navy);border-radius:3px"></div></div></div>`).join('')||'<div class="empty">Pas encore de facturation.</div>'}</div>
 <div class="card"><h3>Occupation</h3><div class="big-num">${oc.taux} %</div><div class="mini">${oc.occ} postes occupés sur ${oc.postes} · ${S.espaces.filter(e=>e.type==='bureau'&&e.statut==='occupé').length} bureau(x) privatif(s)</div><div style="margin-top:12px" class="mini">Salle : ${S.reservations.filter(r=>monthKey(r.date)===nowMonth()&&r.statut!=='annulée').reduce((s,r)=>s+(tmin(r.fin)-tmin(r.debut))/60,0)} h réservées ce mois</div><div class="mini">Passages ce mois : ${S.checkins.filter(c=>monthKey(c.date)===nowMonth()).length}</div><div class="mini">Membres actifs : ${S.membres.filter(m=>m.statut==='actif').length} · Prospects : ${S.membres.filter(m=>m.statut==='prospect').length}</div>
 <h3 style="margin-top:14px">Source des clients</h3>${(()=>{const s={};S.membres.forEach(m=>{s[m.source||'Non renseigné']=(s[m.source||'Non renseigné']||0)+1});return Object.entries(s).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="mini">${esc(x[0])} : <b>${x[1]}</b></div>`).join('')})()}</div>
 <div class="card"><h3>Meilleurs clients (encaissé)</h3>${top.length?`<table>${top.map(x=>`<tr><td>${esc(mName(x.m.id))}</td><td class="r"><b>${fmt0(x.v)} DA</b></td></tr>`).join('')}</table>`:'<div class="empty">—</div>'}</div></div>
 <div class="card"><h3>Impayés et échéances <span class="sp"></span><b>${fmt(imp.reduce((s,f)=>s+App.resteOf(f),0))}</b></h3>${imp.length?`<div class="tw"><table><tr><th>Facture</th><th>Client</th><th>Échéance</th><th class="r">Retard (j)</th><th class="r">Reste dû</th><th></th></tr>${imp.map(f=>{const r=daysBetween(f.echeance,today());return`<tr><td>${f.numero}</td><td>${esc(mName(f.membreId)||f.client)}</td><td>${fmtD(f.echeance)}</td><td class="r" style="${r>0?'color:var(--rd);font-weight:700':''}">${r>0?r:'—'}</td><td class="r">${fmt(App.resteOf(f))}</td><td><button class="btn s" onclick="App.payModal('${f.id}')">Encaisser</button></td></tr>`}).join('')}</table></div>`:'<div class="empty">Aucun impayé. Bravo.</div>'}</div>
 <div class="card" style="margin-top:16px"><h3>Journal d'activité</h3><div style="max-height:220px;overflow:auto">${S.journal.slice(0,60).map(j=>`<div class="mini" style="padding:3px 0;border-bottom:1px solid #EEF0F5">${new Date(j.d).toLocaleString('fr-FR')} — ${esc(j.t)}</div>`).join('')||'—'}</div></div>`};

/* ===================== PARAMÈTRES ===================== */
App.page_parametres=()=>{const s=S.settings;return`<div class="grid g2"><div class="card"><h3>Identité de l'entreprise (en-tête des documents)</h3><form id="fS" class="f f2" onsubmit="return false">${fld('Nom commercial',inp('nom',s.nom))}${fld('Raison sociale',inp('raison',s.raison))}<div style="grid-column:1/-1">${fld('Adresse',inp('adresse',s.adresse))}</div>${fld('RC',inp('rc',s.rc))}${fld('NIF',inp('nif',s.nif))}${fld('AI',inp('ai',s.ai))}${fld('NIS',inp('nis',s.nis))}${fld('Téléphone',inp('tel',s.tel))}${fld('Email',inp('email',s.email))}${fld('Site web',inp('site',s.site))}${fld('Gérant',inp('gerant',s.gerant))}${fld('Banque',inp('banque',s.banque))}${fld('RIB',inp('rib',s.rib))}${fld('Horaires',inp('horaires',s.horaires))}<div class="f f2" style="gap:8px">${fld('Ouverture (h)',inp('ouv',s.ouv,'number'))}${fld('Fermeture (h)',inp('ferm',s.ferm,'number'))}</div>
 <div class="fs">Fiscalité & facturation</div>${fld('TVA (%)',inp('tva',s.tva,'number'))}${fld('Acompte salle non-abonné (%)',inp('acompteSalle',s.acompteSalle,'number'))}<label class="chk"><input type="checkbox" name="timbreActif" ${s.timbreActif?'checked':''}> Droit de timbre sur paiements en espèces</label><div class="f f3" style="gap:8px">${fld('Taux %',inp('timbreTaux',s.timbreTaux,'number','step="0.1"'))}${fld('Min DA',inp('timbreMin',s.timbreMin,'number'))}${fld('Max DA',inp('timbreMax',s.timbreMax,'number'))}</div><div style="grid-column:1/-1">${fld('Conditions de paiement (pied de facture)',`<textarea name="condPaiement">${esc(s.condPaiement)}</textarea>`)}</div>
 <div class="fs">Numérotation</div>${fld('Préfixe factures',inp('pFac',s.pFac))}${fld('Prochain n° facture',inp('nFac',s.nFac,'number'))}${fld('Préfixe devis',inp('pDev',s.pDev))}${fld('Prochain n° devis',inp('nDev',s.nDev,'number'))}${fld('Préfixe reçus',inp('pRec',s.pRec))}${fld('Prochain n° reçu',inp('nRec',s.nRec,'number'))}${fld('Préfixe contrats/attestations',inp('pCtr',s.pCtr))}${fld('Prochain n° contrat',inp('nCtr',s.nCtr,'number'))}
 <div class="fs">Logo</div><div style="grid-column:1/-1;display:flex;gap:12px;align-items:center">${s.logo?`<img src="${s.logo}" style="max-height:60px;border:1px solid var(--line);border-radius:6px;padding:4px">`:''}<input type="file" accept="image/*" onchange="App.loadLogo(this)">${s.logo?`<button class="btn s" onclick="S.settings.logo='';save();render()">Retirer</button>`:''}</div>
 <div style="grid-column:1/-1"><button class="btn p" onclick="App.saveSettings()">Enregistrer les paramètres</button></div></form></div>
 <div><div class="card" style="margin-bottom:16px"><h3>Grille tarifaire <span class="sp"></span><button class="btn s" onclick="App.tarifModal()">+ Tarif</button></h3><div class="tw"><table><tr><th>Code</th><th>Libellé</th><th>Catégorie</th><th class="r">Prix HT*</th><th>Unité</th><th></th></tr>${S.tarifs.map(t=>`<tr><td><b>${esc(t.code)}</b></td><td>${esc(t.label)}</td><td>${esc(t.cat)}</td><td class="r">${fmt0(t.prix)} DA</td><td>${esc(t.unite)}</td><td class="btns"><button class="btn s" onclick="App.tarifModal('${t.id}')">Modifier</button><button class="btn s d" onclick="confirmDel('Supprimer ce tarif ?',()=>{S.tarifs=S.tarifs.filter(x=>x.id!=='${t.id}');save();render()})">×</button></td></tr>`).join('')}</table></div><div class="hint" style="margin-top:8px">* Les pass heure/journée et impressions sont saisis TTC (prix affiché à l'accueil) ; la TVA en est extraite automatiquement. Les abonnements et locations de salle sont HT.</div></div>
 <div class="card"><h3>Sauvegarde & données</h3><p class="hint" style="margin-bottom:10px">Les données sont enregistrées automatiquement dans ce navigateur. Exportez régulièrement une copie de sécurité (fichier JSON) et conservez-la sur Google Drive.</p><div class="btns"><button class="btn p" onclick="App.exportJSON()">Exporter la sauvegarde (.json)</button><label class="btn">Importer une sauvegarde <input type="file" accept=".json" style="display:none" onchange="App.importJSON(this)"></label><button class="btn" onclick="App.exportCSV()">Exporter clients & factures (.csv)</button></div><div class="btns" style="margin-top:14px"><button class="btn" onclick="confirmDel('Charger des données de démonstration (3 clients, factures, réservations) ?',()=>{seedDemo();save();render()})">Charger la démo</button><button class="btn d" onclick="confirmDel('Effacer TOUTES les données (clients, factures, paiements…) ? Cette action est irréversible. Les paramètres et tarifs sont conservés.',()=>{const st=S.settings,tf=S.tarifs;S=defaultState();S.settings=st;S.tarifs=tf;save();render()})">Tout effacer</button></div><div class="mini" style="margin-top:12px">${S.membres.length} clients · ${S.factures.length} factures · ${S.paiements.length} paiements · ${S.reservations.length} réservations · ${S.rdv.length} RDV</div></div></div></div>`};
App.saveSettings=()=>{const o=getForm('fS');['tva','acompteSalle','timbreTaux','timbreMin','timbreMax','nFac','nDev','nRec','nCtr','ouv','ferm'].forEach(k=>o[k]=num(o[k]));Object.assign(S.settings,o);save();toast('Paramètres enregistrés');render()};
App.loadLogo=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{if(r.result.length>400000)return toast('Logo trop lourd (max ~300 Ko) — réduisez l\'image',true);S.settings.logo=r.result;save();render();toast('Logo ajouté')};r.readAsDataURL(f)};
App.tarifModal=id=>{const t=id?T(id):{code:'',label:'',prix:'',unite:'mois',cat:'coworking'};modal(id?'Modifier le tarif':'Nouveau tarif',`<form id="fT" class="f f2" onsubmit="return false">${fld('Code',inp('code',t.code))}${fld('Libellé',inp('label',t.label))}${fld('Prix (DA)',inp('prix',t.prix,'number'))}${fld('Unité',`<select name="unite">${sel(['heure','jour','semaine','mois','trimestre','unité','forfait'].map(x=>({v:x,l:x})),t.unite)}</select>`)}${fld('Catégorie',`<select name="cat">${sel(['coworking','bureau','salle','domiciliation','incubation','service','autre'].map(x=>({v:x,l:x})),t.cat)}</select>`)}</form>`,{onSave:()=>{const o=getForm('fT');if(!o.label)return;const obj={...(t.id?t:{id:uid()}),...o,prix:num(o.prix)};if(id)Object.assign(t,obj);else S.tarifs.push(obj);save();closeModal();render()}})};
App.exportJSON=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download=`horizon-cowork-sauvegarde-${today()}.json`;a.click();toast('Sauvegarde exportée')};
App.importJSON=el=>{const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.settings||!d.membres)throw 0;confirmDel('Remplacer toutes les données actuelles par cette sauvegarde ?',()=>{S=d;save();render();toast('Sauvegarde importée')})}catch(e){toast('Fichier invalide',true)}};r.readAsText(f)};
App.exportCSV=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['Type','Numéro','Date','Client','Objet','HT','TVA','Net','Payé','Statut'].join(';')];S.factures.forEach(f=>rows.push(['Facture',f.numero,f.date,mName(f.membreId)||f.client,f.objet,f.totaux.htn,f.totaux.tva,f.totaux.net,App.paidOf(f.id),f.statut].map(q).join(';')));rows.push('');rows.push(['Client','Type','Téléphone','Email','NIF','RC','Statut','Depuis'].join(';'));S.membres.forEach(m=>rows.push([mName(m.id),m.type,m.tel,m.email,m.nif,m.rc,m.statut,m.dateCreation].map(q).join(';')));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'}));a.download=`horizon-cowork-export-${today()}.csv`;a.click()};

(async()=>{S=await Store.load();if(!S){S=defaultState();seedDemo();await Store.save()}
 if(!S.checkins)S.checkins=[];if(!S.docs)S.docs=[];
 S.abonnements.forEach(a=>{if(a.statut==='actif'&&App.abStatut(a)==='expiré'&&a.espaceId){/* espace reste attribué jusqu'à libération manuelle */}});
 render()})();
